services:
  backend:
    build:
      context: ..
      dockerfile: MakeYourOwnPizza.Presentation/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Server=mysql; Port=3306; Database=${MYSQL_DATABASE}; User=${MYSQL_USER}; Password=${MYSQL_PASSWORD};
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      # Email settings (injected from .env)
      EmailSettings__Host: ${EMAIL_HOST}
      EmailSettings__Port: ${EMAIL_PORT}
      EmailSettings__Username: ${GMAIL_USERNAME}
      EmailSettings__Password: ${GMAIL_APP_PASSWORD}
      EmailSettings__From: ${GMAIL_FROM}
    networks:
      - backend-net
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    networks:
      - backend-net
    volumes:
      - type: volume
        source: mysql_data
        target: /var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  backend-net:

volumes:
  mysql_data:
